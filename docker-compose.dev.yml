# Development mode: code comes from this folder and reloads by itself.
# Rebuild the image only after changing dependencies: pnpm docker:dev:build.

x-common-dist: &common-dist packages-common-dist:/app/packages/common/dist
x-contracts-dist: &contracts-dist packages-contracts-dist:/app/packages/contracts/dist
x-messaging-dist: &messaging-dist packages-messaging-dist:/app/packages/messaging/dist

x-service-command: &service-command >-
  sh -c 'node_modules/.bin/prisma generate
  && node_modules/.bin/prisma migrate deploy
  && exec node_modules/.bin/tsx watch --clear-screen=false src/index.ts'

services:
  # Recompiles shared packages, so services see the changes.
  packages:
    image: ${APP_IMAGE:-event-sharing-app}
    restart: unless-stopped
    init: true
    read_only: true
    # Image files belong to root, and the volumes keep that owner.
    user: root
    network_mode: none
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /app/packages
    command: >-
      sh -c 'for name in contracts common messaging; do
      (cd $$name && /app/node_modules/.bin/tsc -p tsconfig.json);
      done;
      for name in contracts common messaging; do
      (cd $$name && exec /app/node_modules/.bin/tsc -p tsconfig.json --watch --preserveWatchOutput) &
      done;
      wait'
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/contracts/src:/app/packages/contracts/src:ro
      - ./packages/messaging/src:/app/packages/messaging/src:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  gateway:
    command: /app/node_modules/.bin/tsx watch --clear-screen=false src/index.ts
    volumes:
      - ./apps/gateway/src:/app/apps/gateway/src:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  frontend:
    command: node_modules/.bin/tsx src/server.ts --dev
    # Replaces the production cache, because development writes all of .next.
    tmpfs: !override
      - /tmp
      - /app/apps/frontend/.next:uid=1000,gid=1000
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src:ro
      - ./apps/frontend/next.config.ts:/app/apps/frontend/next.config.ts:ro
      # Next.js rewrites this file on start; the root stays read-only.
      - ./infra/docker/next-env.dev.d.ts:/app/apps/frontend/next-env.d.ts
      - *contracts-dist

  auth:
    command: *service-command
    volumes:
      - ./services/auth/src:/app/services/auth/src
      - ./services/auth/prisma:/app/services/auth/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  users:
    command: *service-command
    volumes:
      - ./services/users/src:/app/services/users/src
      - ./services/users/prisma:/app/services/users/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  events:
    command: *service-command
    volumes:
      - ./services/events/src:/app/services/events/src
      - ./services/events/prisma:/app/services/events/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  geo-search:
    command: *service-command
    volumes:
      - ./services/geo-search/src:/app/services/geo-search/src
      - ./services/geo-search/prisma:/app/services/geo-search/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  participation:
    command: *service-command
    volumes:
      - ./services/participation/src:/app/services/participation/src
      - ./services/participation/prisma:/app/services/participation/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  notifications:
    command: *service-command
    volumes:
      - ./services/notifications/src:/app/services/notifications/src
      - ./services/notifications/prisma:/app/services/notifications/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  messages:
    command: *service-command
    volumes:
      - ./services/messages/src:/app/services/messages/src
      - ./services/messages/prisma:/app/services/messages/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  event-log:
    command: *service-command
    volumes:
      - ./services/event-log/src:/app/services/event-log/src
      - ./services/event-log/prisma:/app/services/event-log/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

  storage:
    command: *service-command
    volumes:
      - ./services/storage/src:/app/services/storage/src
      - ./services/storage/prisma:/app/services/storage/prisma:ro
      - *common-dist
      - *contracts-dist
      - *messaging-dist

volumes:
  packages-common-dist:
  packages-contracts-dist:
  packages-messaging-dist:
