name: event-sharing

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-event_sharing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: '1'
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: CtSz26DYr6KPV2XuQqfvzg
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_LOG_RETENTION_HOURS: '720'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - '127.0.0.1:9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - 127.0.0.1:9092
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  clamav:
    image: clamav/clamav:stable
    profiles: [storage]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav

  storage:
    image: event-sharing-storage
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    profiles: [storage]
    restart: unless-stopped
    network_mode: host
    env_file: ./services/storage/.env
    environment:
      HOST: 127.0.0.1
      STORAGE_PATH: /data/files
      STORAGE_BACKUP_PATH: /data/backups
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    volumes:
      - storage-data:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  storage-backup:
    image: event-sharing-storage
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    profiles: [storage]
    restart: unless-stopped
    network_mode: host
    env_file: ./services/storage/.env
    environment:
      STORAGE_PATH: /data/files
      STORAGE_BACKUP_PATH: /data/backups
    command: ['node', 'dist/backup.js']
    volumes:
      - storage-data:/data/files:ro
      - storage-backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy

  storage-restore:
    image: event-sharing-storage
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    profiles: [storage-restore]
    network_mode: host
    env_file: ./services/storage/.env
    environment:
      STORAGE_PATH: /data/files
      STORAGE_BACKUP_PATH: /data/backups
    entrypoint: ['node', 'dist/restore.js']
    volumes:
      - storage-data:/data/files
      - storage-backups:/data/backups:ro

  project-backup:
    image: postgis/postgis:18-3.6
    profiles: [backup]
    restart: unless-stopped
    entrypoint: ['bash', '/app/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-event_sharing}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./infra/backup/backup.sh:/app/backup.sh:ro
      - ./.env:/configuration/.env:ro
      - ./services:/configuration/services:ro
      - ./apps/gateway:/configuration/apps/gateway:ro
      - storage-data:/data/files:ro
      - ${PROJECT_BACKUP_PATH:-/storage/event-sharing-backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
  kafka-data:
  storage-data:
  storage-backups:
  clamav-data:
