# Scrapes every service on its private metrics port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - gateway:9464
          - auth:9464
          - users:9464
          - events:9464
          - geo-search:9464
          - participation:9464
          - notifications:9464
          - messages:9464
          - event-log:9464
          - storage:9464
    relabel_configs:
      # instance="events" instead of "events:9464".
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
